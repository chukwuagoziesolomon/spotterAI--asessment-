<!doctype html>
<html><head><meta charset="utf-8"><title>Route & fuel stops</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
 body{margin:0;font-family:system-ui,sans-serif} #map{height:100vh}
 #info{position:absolute;z-index:1000;top:10px;right:10px;background:#fff;padding:12px 14px;border-radius:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.3);max-width:300px;font-size:14px}
</style></head><body>
<div id="info">Loading route…</div><div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const params = new URLSearchParams(location.search);
const map = L.map('map');
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
fetch('/api/route/?' + params).then(r => r.json()).then(d => {
  const info = document.getElementById('info');
  if (d.error) { info.textContent = d.error; return; }
  const line = L.geoJSON(d.route, {style:{color:'#2563eb',weight:5}}).addTo(map);
  map.fitBounds(line.getBounds());
  const mk = (p, label, color) => L.circleMarker([p.lat,p.lng],{radius:9,color,fillOpacity:.9}).addTo(map).bindPopup(label);
  mk(d.start,'Start: '+d.start.label,'green'); mk(d.finish,'Finish: '+d.finish.label,'red');
  d.fuel_stops.forEach((s,i) => mk(s,
    `<b>#${i+1} ${s.name}</b><br>${s.city}, ${s.state}<br>$${s.price_per_gallon}/gal · mile ${s.mile_marker}<br>`+
    `${s.gallons_purchased} gal = $${s.cost}`,'#f59e0b'));
  info.innerHTML = `<b>${d.distance_miles} mi</b> · ${d.fuel_stops.length} fuel stop(s)<br>` +
    `Total fuel spend: <b>$${d.total_fuel_cost}</b>`;
});
</script></body></html>
